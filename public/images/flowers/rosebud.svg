<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" width="160" height="260" role="img" aria-label="Blush rosebud on a stem">
  <defs>
    <radialGradient id="bud-p" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#fbeaee"/>
      <stop offset="60%" stop-color="#eabfcd"/>
      <stop offset="100%" stop-color="#d49fb0"/>
    </radialGradient>
    <linearGradient id="bud-sep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9b58f"/>
      <stop offset="100%" stop-color="#8aa07a"/>
    </linearGradient>
    <linearGradient id="bud-stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9bab84"/>
      <stop offset="100%" stop-color="#89a07c"/>
    </linearGradient>
  </defs>

  <!-- stem -->
  <path d="M80 118 C82 170 80 214 79 252" fill="none" stroke="url(#bud-stem)" stroke-width="6" stroke-linecap="round"/>
  <!-- a leaf on the stem -->
  <path d="M80 176 C104 168 122 176 132 196 C110 202 90 196 80 176 Z" fill="#8fa679" opacity="0.9"/>
  <path d="M80 210 C58 204 42 212 34 230 C54 236 72 230 80 210 Z" fill="#9cb187" opacity="0.85"/>

  <!-- calyx / sepals -->
  <g fill="url(#bud-sep)">
    <path d="M80 132 C64 128 54 108 58 92 C70 104 78 116 80 132 Z"/>
    <path d="M80 132 C96 128 106 108 102 92 C90 104 82 116 80 132 Z"/>
    <path d="M80 134 C80 118 80 104 80 90 C86 106 86 120 80 134 Z"/>
  </g>

  <!-- bud petals -->
  <g>
    <path d="M80 118 C58 108 52 66 80 46 C108 66 102 108 80 118 Z" fill="url(#bud-p)"/>
    <path d="M80 112 C66 106 62 74 80 58 C98 74 94 106 80 112 Z" fill="#f4d7e0" opacity="0.9"/>
    <path d="M80 108 C72 104 70 82 80 70 C90 82 88 104 80 108 Z" fill="#fbeef2" opacity="0.85"/>
  </g>
</svg>
