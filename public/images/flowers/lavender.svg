<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 320" width="140" height="320" role="img" aria-label="Soft lavender sprig">
  <defs>
    <linearGradient id="lav-stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7b58c"/>
      <stop offset="100%" stop-color="#8fa47c"/>
    </linearGradient>
    <radialGradient id="lav-bud" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#e7ddf0"/>
      <stop offset="60%" stop-color="#c3aed3"/>
      <stop offset="100%" stop-color="#9d84a6"/>
    </radialGradient>
  </defs>

  <!-- three gentle stems -->
  <g fill="none" stroke="url(#lav-stem)" stroke-width="4" stroke-linecap="round">
    <path d="M70 312 C70 250 66 200 62 150"/>
    <path d="M70 312 C74 250 84 206 96 168"/>
    <path d="M70 312 C66 252 52 214 40 182"/>
  </g>

  <!-- flower spikes: clusters of small buds -->
  <g fill="url(#lav-bud)">
    <!-- centre spike -->
    <g>
      <ellipse cx="62" cy="150" rx="9" ry="12"/>
      <ellipse cx="58" cy="132" rx="8.5" ry="11"/>
      <ellipse cx="64" cy="118" rx="8" ry="10.5"/>
      <ellipse cx="60" cy="104" rx="7.5" ry="10"/>
      <ellipse cx="63" cy="92" rx="6.5" ry="9"/>
      <ellipse cx="61" cy="82" rx="5.5" ry="8"/>
      <ellipse cx="62" cy="74" rx="4.2" ry="6"/>
    </g>
    <!-- right spike -->
    <g opacity="0.95">
      <ellipse cx="96" cy="168" rx="8" ry="11"/>
      <ellipse cx="100" cy="152" rx="7.5" ry="10"/>
      <ellipse cx="98" cy="138" rx="7" ry="9.5"/>
      <ellipse cx="102" cy="126" rx="6" ry="8.5"/>
      <ellipse cx="100" cy="116" rx="5" ry="7"/>
      <ellipse cx="101" cy="108" rx="4" ry="5.5"/>
    </g>
    <!-- left spike -->
    <g opacity="0.9">
      <ellipse cx="40" cy="182" rx="8" ry="11"/>
      <ellipse cx="36" cy="166" rx="7.5" ry="10"/>
      <ellipse cx="39" cy="152" rx="7" ry="9.5"/>
      <ellipse cx="35" cy="140" rx="6" ry="8.5"/>
      <ellipse cx="37" cy="130" rx="5" ry="7"/>
      <ellipse cx="36" cy="122" rx="4" ry="5.5"/>
    </g>
  </g>
</svg>
